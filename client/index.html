<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Image Optimizer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-2xl">
    <div class="text-center mb-10">
      <h1 class="text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500 mb-4 tracking-tight leading-[normal]">Image Optimizer</h1>
      <p class="text-slate-400 text-lg">Compress, resize, and convert your images instantly.</p>
    </div>

    <!-- Success Banner -->
    <div id="successBanner" role="status" aria-live="polite" tabindex="-1" class="hidden fixed top-4 right-4 z-50 w-[calc(100%-2rem)] max-w-sm p-4 rounded-xl bg-emerald-950/80 border border-emerald-500/30 text-emerald-100 backdrop-blur-md shadow-2xl transition-all duration-300 outline-none">
      <div class="flex items-start justify-between">
        <div class="flex items-start gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mt-0.5 shrink-0" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
          <div>
            <span class="font-bold block mb-1">Optimization Successful!</span>
            <p id="successMessage" class="text-sm text-emerald-200/80"></p>
          </div>
        </div>
        <div class="flex flex-col items-end gap-2 ml-4">
          <button type="button" id="closeSuccessBtn" aria-label="Close success message" class="text-emerald-400 hover:text-emerald-100 transition-colors p-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
          <button type="button" id="successResetBtn" class="text-[10px] uppercase tracking-wider font-bold bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 px-2 py-1 rounded transition-colors whitespace-nowrap">
            Process Another
          </button>
        </div>
      </div>
    </div>

    <!-- Error Banner -->
    <div id="errorBanner" role="alert" aria-live="assertive" tabindex="-1" class="hidden fixed top-4 right-4 z-50 w-[calc(100%-2rem)] max-w-sm p-4 rounded-xl bg-red-950/80 border border-red-500/30 text-red-200 backdrop-blur-md shadow-2xl flex items-start justify-between gap-3 transition-all duration-300 outline-none">
      <div class="flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span id="errorMessage" class="font-medium text-sm"></span>
      </div>
      <button type="button" id="closeErrorBtn" aria-label="Close error message" class="text-red-400 hover:text-red-100 transition-colors p-1 -mt-1">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form id="optimizerForm" class="glass rounded-2xl p-6 md:p-8 shadow-2xl transition-all duration-500">
      
      <!-- Upload Section -->
      <div id="uploadArea" class="relative group cursor-pointer">
        <label for="imageInput" class="sr-only">Choose image to optimize</label>
        <input type="file" id="imageInput" name="image" accept="image/*" 
               aria-describedby="uploadSubtext" 
               class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10 focus:outline-none" required multiple>
        <div class="h-72 border-2 border-dashed border-slate-600 rounded-xl p-10 flex flex-col items-center justify-center text-center transition-all duration-300 group-hover:border-blue-400 group-hover:bg-blue-400/5 group-focus-within:border-blue-400 group-focus-within:bg-blue-400/5 group-focus-within:ring-2 group-focus-within:ring-blue-400/20" aria-hidden="true">
          
          <div id="uploadIcon" class="mb-4 text-slate-400 group-hover:text-blue-400 group-focus-within:text-blue-400 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
          </div>
          <p id="uploadText" class="text-lg font-medium text-slate-300 mb-1">Click or drag image to upload</p>
          <p id="uploadSubtext" class="text-sm text-slate-500">Supports JPEG, PNG, WEBP, AVIF, GIF</p>
          
          <img id="imagePreview" alt="Upload preview" class="hidden max-h-full rounded-lg shadow-lg object-contain w-full object-cover" />
          <div id="previewGrid" class="hidden grid grid-cols-2 sm:grid-cols-3 gap-2 w-full max-h-48 overflow-y-auto p-2"></div>
        </div>
      </div>

      <!-- Settings Section -->
      <fieldset id="settingsArea" class="mt-8 space-y-6 animate-fade-in border-none">
        <legend class="sr-only">Optimization Settings</legend>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Name Input -->
          <div id="nameInputWrapper">
            <label for="imageName" class="block text-sm font-medium text-slate-300 mb-2">New File Name (optional)</label>
            <input type="text" id="imageName" name="name" placeholder="optimized-image" 
                   class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
          </div>
          
          <!-- Format Select -->
          <div>
            <label for="imageFormat" class="block text-sm font-medium text-slate-300 mb-2">Target Format (optional)</label>
            <div class="relative">
              <select id="imageFormat" name="format" 
                      class="w-full bg-slate-800 border border-slate-600 rounded-lg px-4 py-3 text-slate-200 appearance-none focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition-all cursor-pointer">
                <option value="">Keep Original Format</option>
                <option value="jpeg">JPEG</option>
                <option value="png">PNG</option>
                <option value="webp">WEBP</option>
                <option value="avif">AVIF</option>
                <option value="gif">GIF</option>
              </select>
              <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400" aria-hidden="true">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-col md:flex-row gap-4">
          <button type="submit" id="submitBtn" class="flex-1 bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-400 hover:to-purple-500 text-white font-semibold py-4 px-6 rounded-xl shadow-lg transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-blue-500/50 flex justify-center items-center gap-2">
            <span>Optimize & Download</span>
            <svg id="loadingSpinner" aria-hidden="true" class="hidden animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
          </button>
          
          <button type="button" id="resetBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-4 px-8 rounded-xl border border-slate-700 transition-all duration-200 focus:outline-none focus:ring-4 focus:ring-slate-500/30">
            Reset
          </button>
        </div>
      </fieldset>
      
    </form>
  </main>
  
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
